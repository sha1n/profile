"$schema" = 'https://starship.rs/config-schema.json'

# Each git module after the branch starts with its own space, so the group ends with one space only in a repo.
format = """
$username$hostname$directory\
($git_branch$git_commit$git_state${custom.git_files}$git_metrics$git_status )\
$all"""

palette = 'git'

[palettes.git]
branch = '#b8c084'
muted = '#8b98a0'
added = '#8fa83c'
deleted = '#d9473f'

[aws]
disabled = true

[gcloud]
disabled = true

[git_branch]
symbol = ' '
style = 'fg:branch'
format = '[$symbol$branch(:$remote_branch)]($style)'

[git_commit]
style = 'fg:branch'
format = '[ \($hash$tag\)]($style)'

[git_state]
style = 'fg:yellow'
format = '[ \($state( $progress_current/$progress_total)\)]($style)'

# Starship has no variable for the total number of changed files.
# --ignore-submodules=dirty skips the scan of every submodule's working tree, which
# can push the module past command_timeout; a moved submodule commit still counts.
[custom.git_files]
description = 'Number of changed files, staged, unstaged or untracked'
when = true
require_repo = true
shell = ['sh']
command = 'n=$(git status --porcelain --ignore-submodules=dirty | wc -l | tr -d " "); [ "$n" -eq 0 ] || echo "$n"'
style = 'fg:muted'
format = '([ ± $output]($style))'

# Untracked files count in ± N but add no lines here: git_metrics diffs tracked files against HEAD.
[git_metrics]
disabled = false
ignore_submodules = true
format = '( [•](fg:muted)( [+$added](fg:added))( [-$deleted](fg:deleted)))'

# File counts come from custom.git_files; the stash, conflict and remote state left here needs no submodule scan.
[git_status]
ignore_submodules = true
format = '($all_status$ahead_behind)'
conflicted = '[ =${count}](bold fg:red)'
stashed = '[ ≡${count}](fg:purple)'
deleted = ''
renamed = ''
modified = ''
staged = ''
typechanged = ''
untracked = ''
ahead = '[ ⇡${count}](fg:added)'
behind = '[ ⇣${count}](fg:deleted)'
diverged = '[ ⇡${ahead_count}⇣${behind_count}](bold fg:yellow)'
up_to_date = ''
