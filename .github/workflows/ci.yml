name: CI
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"

jobs:
  main:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0 

      - name: Install Zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install zsh

      - name: Zsh Version
        run: zsh --version

      - name: Update Submodules
        run: make update_submodules

      # Runner images ship group-writable fpath directories. compaudit rejects
      # them, and compinit aborts with an error when it has no terminal to ask.
      - name: Secure Completion Directories
        shell: zsh {0}
        run: |
          fpath=("$PWD/zsh-plugins/zsh-completions/src" $fpath)
          autoload -U compaudit
          insecure=(${(f)"$(compaudit 2>/dev/null)"})
          print -l -- $insecure
          (( ${#insecure} == 0 )) || sudo chmod g-w,o-w -- $insecure

      - name: Run Tests
        run: make test
