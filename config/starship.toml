"$schema" = 'https://starship.rs/config-schema.json'

# Each git module after the branch starts with its own space, so the group ends with one space only in a repo.
format = """
$username$hostname$directory\
($git_branch$git_commit$git_state$git_metrics$git_status )\
$all"""

palette = 'git'

[palettes.git]
branch = '#b8c084'
muted = '#8b98a0'
added = '#8fa83c'
deleted = '#d9473f'

[aws]
disabled = true

[gcloud]
disabled = true

[git_branch]
symbol = ' '
style = 'fg:branch'
format = '[$symbol$branch(:$remote_branch)]($style)'

[git_commit]
style = 'fg:branch'
format = '[ \($hash$tag\)]($style)'

[git_state]
style = 'fg:yellow'
format = '[ \($state( $progress_current/$progress_total)\)]($style)'

# Untracked files add no lines here: git_metrics diffs tracked files against HEAD.
[git_metrics]
disabled = false
ignore_submodules = true
format = '( [•](fg:muted)( [+$added](fg:added))( [-$deleted](fg:deleted)))'

# The per-file counts are blanked: the working tree scan behind them exceeds command_timeout in large repos.
# The stash, conflict and remote state left here needs no working tree or submodule scan.
[git_status]
ignore_submodules = true
format = '($all_status$ahead_behind)'
conflicted = '[ =${count}](bold fg:red)'
stashed = '[ ≡${count}](fg:purple)'
deleted = ''
renamed = ''
modified = ''
staged = ''
typechanged = ''
untracked = ''
ahead = '[ ⇡${count}](fg:added)'
behind = '[ ⇣${count}](fg:deleted)'
diverged = '[ ⇡${ahead_count}⇣${behind_count}](bold fg:yellow)'
up_to_date = ''
