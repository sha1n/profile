name: CI
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"

jobs:
  main:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0 

      - name: Install Zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install zsh

      - name: Zsh Version
        run: zsh --version

      - name: Update Submodules
        run: make update_submodules

      - name: Run Tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install shellcheck and shfmt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt
      - name: shellcheck
        run: shellcheck --shell=bash --severity=warning install.sh update_dotfiles.sh || true
      - name: shfmt
        run: shfmt -d -i 2 -ci install.sh update_dotfiles.sh || true
